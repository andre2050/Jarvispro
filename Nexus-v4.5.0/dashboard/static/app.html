<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS Ultra 2026 — por André Luiz Lima Menezes</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#07090f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #07090f;
      --surface: rgba(255,255,255,0.04);
      --border:  rgba(255,255,255,0.07);
      --accent:  #6366f1;
      --adim:    rgba(99,102,241,0.14);
      --text:    #dde3ed;
      --muted:   #5e6a7e;
      --green:   #22c55e;
      --gdim:    rgba(34,197,94,0.14);
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: rgba(7,9,15,0.95);
    }
    .logo { font-size: 15px; font-weight: 700; letter-spacing: 6px; }
    .logo em { color: var(--accent); font-style: normal; }
    .pill {
      display: flex; align-items: center; gap: 6px; padding: 4px 11px;
      border-radius: 99px; background: var(--surface); border: 1px solid var(--border);
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); transition: all 0.3s;
    }
    .pill.on { background: var(--gdim); border-color: rgba(34,197,94,0.3); color: var(--green); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .pill.on .dot { background: var(--green); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .spacer { flex: 1; }
    .enc-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 8px;
      border-radius: 4px; display: none;
    }
    .enc-badge.on  { display: block; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: var(--green); }
    .enc-badge.off { display: block; background: rgba(255,100,100,0.08); border: 1px solid rgba(255,100,100,0.2); color: #f87171; }
    .url { font-size: 10px; font-family: monospace; color: var(--muted); padding: 4px 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }

    /* ── FEED ── */
    main { flex: 1; overflow-y: auto; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
    main::-webkit-scrollbar { width: 3px; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; animation: pop 0.18s ease; }
    @keyframes pop { from { opacity:0; transform:translateY(4px); } }
    .msg-j   { align-self:flex-start; background:var(--adim);   border:1px solid rgba(99,102,241,0.18); border-bottom-left-radius:4px; }
    .msg-u   { align-self:flex-end;   background:var(--surface); border:1px solid var(--border);        border-bottom-right-radius:4px; }
    .msg-sys { align-self:center; font-size:11px; color:var(--muted); padding:2px 0; background:transparent; border:none; letter-spacing:0.3px; }
    .lbl { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; margin-bottom:4px; }
    .msg-j .lbl { color:var(--accent); }
    .msg-u .lbl { color:var(--muted); text-align:right; }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; border-bottom-right-radius: 4px;
      padding: 11px 14px; display: flex; align-items: center; gap: 12px;
      max-width: 82%; animation: pop 0.18s ease;
    }
    .fc-icon { font-size: 26px; flex-shrink: 0; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; color:var(--muted); margin-bottom:4px; }
    .fc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .fc-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.12s linear; }
    .fc-status { font-size: 10px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; color: var(--muted); }
    .fc-status.done { color: var(--green); }
    .fc-status.err  { color: #f87171; }
    .fc-dl { display:block; margin-top:6px; font-size:11px; color:var(--accent); text-decoration:none; font-weight:600; }
    .fc-dl:hover { opacity: 0.8; }

    /* ── FOOTER ── */
    footer { flex-shrink:0; padding:10px 14px; border-top:1px solid var(--border); background:rgba(7,9,15,0.95); display:flex; gap:8px; align-items:center; }
    #inp { flex:1; padding:11px 14px; background:var(--surface); border:1.5px solid var(--border); border-radius:12px; color:var(--text); font-size:14px; outline:none; transition:border-color 0.15s; }
    #inp:focus { border-color: var(--accent); }
    #inp::placeholder { color: var(--muted); }
    .btn { padding:11px 15px; border:none; border-radius:12px; font-size:11px; font-weight:700; letter-spacing:1.5px; cursor:pointer; transition:opacity 0.15s,transform 0.1s; }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { opacity: 0.82; }
    .btn-send { background: var(--accent); color: #fff; }
    .btn-wake { background:var(--surface); border:1px solid var(--border); color:var(--muted); display:none; }
    .btn-wake.show { display:block; color:var(--green); border-color:rgba(34,197,94,0.35); }
    .btn-attach {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-attach:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    .btn-attach:active { transform: scale(0.96); }

    /* ── MIC BUTTON ── */
    #mic-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s, background 0.2s, border-color 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #mic-btn:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    #mic-btn:active { transform: scale(0.96); }
    #mic-btn.recording {
      background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.45); color: #ef4444;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    #mic-btn.unsupported { opacity: 0.3; cursor: not-allowed; }
    @keyframes mic-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.65;transform:scale(0.97)} }

    /* ── TOAST ── */
    #toast {
      position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
      background:rgba(34,197,94,0.16); border:1px solid rgba(34,197,94,0.4);
      color:var(--green); font-size:12px; font-weight:700; letter-spacing:1px;
      padding:7px 18px; border-radius:99px;
      opacity:0; transition:opacity 0.22s,transform 0.22s;
      pointer-events:none; white-space:nowrap;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .enc-badge{white-space:nowrap}
    @media (max-width:430px){
      header{gap:7px;padding-left:12px;padding-right:12px}
      .url{display:none}
      header .logo{font-size:15px;letter-spacing:.14em}
      header>button{padding:0 2px!important;font-size:16px!important}
      .enc-badge{padding:3px 6px}
      .btn{padding:11px 11px;letter-spacing:1px}
      footer{gap:6px;padding-left:10px;padding-right:10px}
      #inp{min-width:0}
    }
  #quick{flex-shrink:0;display:flex;gap:7px;overflow-x:auto;padding:8px 14px 0;background:rgba(7,9,15,0.95);scrollbar-width:none}
    #quick::-webkit-scrollbar{display:none}
    #quick button{flex:0 0 auto;padding:7px 12px;border:1px solid var(--border);border-radius:99px;background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap}
    #quick button:hover,#quick button:active{border-color:var(--accent);background:var(--adim)}
  </style>
</head>
<body>
  <div id="mis-painel" style="display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:14px;color:var(--text)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <b>🎯 Missões</b><button onclick="_missoesFechar()" style="background:none;border:0;color:var(--text);font-size:20px;cursor:pointer">✕</button>
    </div>
    <div id="mis-lista"></div>
  </div>
  <div id="aud-painel" style="display:none;position:fixed;inset:0;z-index:51;background:var(--bg);overflow:auto;padding:14px;color:var(--text)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <b>🧾 O que o NEXUS fez</b><button onclick="_audFechar()" style="background:none;border:0;color:var(--text);font-size:20px;cursor:pointer">✕</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
      <input id="aud-q" placeholder="buscar (ex.: e-mail, apagou)" style="flex:1;min-width:140px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)">
      <select id="aud-dias" style="padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)">

  <header>
    <div class="logo"><em>N</em>EXUS</div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Conectando</span></div>

  </header>

    <button type="button" data-cmd="Que horas são?">🕒 Hora</button>

    <input id="inp" placeholder="Diga ao NEXUS o que fazer…" autocomplete="off">

    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <button id="mic-btn" onclick="doMic()" title="Comando de voz">🎤</button>
    <button class="btn btn-wake" id="wake" onclick="doWake()">ACORDAR</button>
    <button class="btn btn-send" onclick="doSend()">ENVIAR</button>
  </footer>

  <script>
    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('jarvis_token');
    const _sessionKey = sessionStorage.getItem('jarvis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    const _AES_SALT = 'NEXUS-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }
    else           { encBadge.className = 'enc-badge off'; encBadge.textContent = 'SEM CRIPTO'; }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => { sys('Sessão remota ativa.'); toast('Conectado ao NEXUS'); };
    ws.onclose   = () => sys('Conexão perdida — atualize a página para reconectar.');
    ws.onerror   = () => sys('Erro de conexão.');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log')           { append(m.speaker, m.text); if (m.speaker === 'jarvis') _avisar(m.text); }
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('Wake word detected — connecting…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Ativo'; wake.classList.remove('show');
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Em repouso'; wake.classList.add('show');
      }
    }

    function append(speaker, text) {
      const d = document.createElement('div');
      if (speaker === 'jarvis') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">Nexus</div>${esc(text)}`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">Você</div>${esc(text)}`;
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function sys(text) {
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = text;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return '📦';
      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return '⚙️';
      return '📎';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Enviado';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Baixar de volta</a>`);
          toast('Arquivo enviado!');
        } else {
          let errMsg = 'Falha no envio';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#f87171';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Erro de conexão';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // File received by another WebSocket client (e.g., second open tab)
    function _onFileReceived(m) {
      const dlUrl = `/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`;
      const card  = document.createElement('div');
      card.className = 'msg-file';
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(m.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Received</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
          <a class="fc-dl" href="${dlUrl}" download="${esc(m.name)}">⬇ Download</a>
        </div>
        <div class="fc-status done">✓</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      toast('Arquivo recebido no computador!');
    }

    // File input change handler
    document.getElementById('file-inp').addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadFile);
      this.value = ''; // reset so the same file can be re-sent
    });

    // ── Commands ──────────────────────────────────────────────────────────────
    function doSend() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      append('user', txt);
      const enc  = _encrypt(txt);
      const body = enc ? { enc } : { text: txt };
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function doWake() {
      sys('Enviando sinal para acordar…');
      _authFetch('/api/wake', { method: 'POST' });
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────
    const micBtn  = document.getElementById('mic-btn');
    let _voiceWs  = null;
    let _audioCtx = null;
    let _micStm   = null;
    let _audioNd  = null;

    function _micIdle() {
      micBtn.innerHTML = '🎤';
      micBtn.title     = 'Voz — toque para falar';
      micBtn.classList.remove('recording');
    }

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return; // show once
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.style.cssText = [
        'align-self:stretch', 'background:rgba(99,102,241,0.07)',
        'border:1px solid rgba(99,102,241,0.22)', 'border-radius:14px',
        'padding:16px 18px', 'font-size:13px', 'line-height:1.8',
        'animation:pop 0.18s ease'
      ].join(';');
      card.innerHTML =
        '<div style="font-weight:700;color:#818cf8;letter-spacing:.5px;margin-bottom:10px">🎤 Configuração única da voz</div>' +
        '<ol style="padding-left:18px;color:#8899aa;margin:0;display:flex;flex-direction:column;gap:4px">' +
        '<li>Abra uma nova aba → vá para <span style="background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px">chrome://flags</span></li>' +
        '<li>Procure: <strong style="color:#dde3ed">Insecure origins treated as secure</strong></li>' +
        '<li>Cole este endereço na caixa:<br><span id="flags-url" style="background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer">' + esc(origin) + '</span></li>' +
        '<li>Mude para <strong style="color:#22c55e">Enabled</strong> (Ativado) → toque em <strong style="color:#dde3ed">Relaunch</strong> (Reiniciar)</li>' +
        '<li>Volte aqui e toque em 🎤</li>' +
        '</ol>';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      // tap to copy
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('Endereço copiado!')).catch(() => {});
      });
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microfone negado — toque no cadeado da barra de endereço e permita o microfone.'
          : 'Erro no microfone: ' + e.message);
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title     = 'Toque para parar';
        micBtn.classList.add('recording');
        sys('Voz ativa — pode falar');
        toast('🎤 Live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Falha na conexão de voz.'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }

    // ── PWA: instalar na tela inicial + avisos locais (3.5) ──────────────────────
    // Service worker só funciona em contexto seguro (https confiável ou localhost).
    if ('serviceWorker' in navigator && window.isSecureContext) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
    const _bell = document.getElementById('bell');
    function _avisosLigados() { try { return localStorage.getItem('nexus_avisos') === '1'; } catch (e) { return false; } }
    function _pintaSino() {
      if (!_bell) return;
      _bell.style.opacity = (_avisosLigados() && Notification.permission === 'granted') ? '1' : '0.4';
    }
    if (_bell && 'Notification' in window && window.isSecureContext) {
      _bell.style.display = '';
      _pintaSino();
      _bell.onclick = async () => {
        if (_avisosLigados()) { try { localStorage.setItem('nexus_avisos', '0'); } catch (e) {} _cancelarPush(); _pintaSino(); toast('Avisos desligados'); return; }
        const p = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
        if (p === 'granted') { try { localStorage.setItem('nexus_avisos', '1'); } catch (e) {} toast('Avisos ligados'); _assinarPush(); }
        else toast('Permissão negada no navegador');
        _pintaSino();
      };
    }
    // Web Push (avisos com o app FECHADO): o celular entrega uma assinatura ao NEXUS; precisa de https confiável (túnel).
    function _b64uParaBytes(b) {
      const p = '='.repeat((4 - b.length % 4) % 4), s = (b + p).replace(/-/g, '+').replace(/_/g, '/');
      return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    }
    async function _assinarPush() {
      try {
        if (!('PushManager' in window) || !navigator.serviceWorker) return;
        const r = await _authFetch('/api/push/chave'); const d = await r.json();
        if (!d.ok || !d.disponivel) { toast('Avisos com o app fechado: falta o pacote pywebpush no PC'); return; }
        const reg = await navigator.serviceWorker.ready;
        const sub = (await reg.pushManager.getSubscription()) ||
          await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: _b64uParaBytes(d.key) });
        await _authFetch('/api/push/assinar', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                 body: JSON.stringify({ subscription: sub.toJSON() }) });
        toast('Avisos com o app fechado: ligados');
      } catch (e) { toast('Não consegui ligar os avisos com o app fechado'); }
    }
    async function _cancelarPush() {
      try {
        const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
        if (!sub) return;
        await _authFetch('/api/push/cancelar', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                  body: JSON.stringify({ endpoint: sub.endpoint }) });
        await sub.unsubscribe();
      } catch (e) {}
    }
    // Aviso só quando a página está em segundo plano; texto cortado, nada é guardado.
    function _avisar(texto) {
      if (!document.hidden || !_avisosLigados() || !('Notification' in window) || Notification.permission !== 'granted') return;
      const corpo = String(texto || '').slice(0, 160);
      if (navigator.serviceWorker && navigator.serviceWorker.ready) {
        navigator.serviceWorker.ready.then((r) => r.showNotification('NEXUS', { body: corpo, icon: '/icons/icon-192.png', tag: 'nexus' })).catch(() => {});
      } else { try { new Notification('NEXUS', { body: corpo, icon: '/icons/icon-192.png' }); } catch (e) {} }
    }

    // Missões de longa duração: acompanhar, aprovar/negar decisões, cancelar, pausar e desfazer. Todo texto entra por textContent.
    let _misTimer = null, _misAberta = '';
    function _el(tag, texto, css) { const e = document.createElement(tag); if (texto != null) e.textContent = texto; if (css) e.style.cssText = css; return e; }
    async function _misAcao(mid, acao, extra) {
      try {
        const r = await _authFetch('/api/missoes/' + encodeURIComponent(mid) + '/' + acao,
          { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(extra || {}) });
        const d = await r.json(); if (!d.ok) toast(d.error || 'Não deu'); else if (d.texto) toast(d.texto.slice(0, 120));
      } catch (e) { toast('Sem conexão'); }
      _missoesAtualizar();
    }
    function _misBtn(txt, fn, cor) {
      const b = _el('button', txt, 'margin:4px 6px 0 0;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:' + (cor || 'var(--surface)') + ';color:var(--text);cursor:pointer');
      b.onclick = fn; return b;
    }
    async function _missoesAtualizar() {
      const box = document.getElementById('mis-lista'); if (!box) return;
      let ls = [];
      try { ls = (await (await _authFetch('/api/missoes')).json()).missoes || []; } catch (e) { return; }
      box.textContent = '';
      if (!ls.length) { box.appendChild(_el('p', 'Nenhuma missão. Peça por voz: “NEXUS, missão: …”', 'color:var(--muted)')); return; }
      for (const m of ls) {
        const card = _el('div', null, 'border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px;margin-bottom:10px');
        card.appendChild(_el('div', m.objetivo, 'font-weight:600'));
        card.appendChild(_el('div', m.estado + ' · ' + m.feitos + '/' + m.passos + ' passos', 'color:var(--muted);font-size:13px;margin:4px 0'));
        let det = null;
        if (['plano_pronto', 'aguardando', 'executando', 'pausada', 'concluida', 'falhou'].includes(m.estado)) {
          try { det = await (await _authFetch('/api/missoes/' + encodeURIComponent(m.id))).json(); } catch (e) {}
        }
        if (det && det.missao) {
          const pend = (det.missao.decisoes || []).filter((d) => d.estado === 'pendente');
          for (const d of pend) {
            card.appendChild(_el('div', d.pergunta || 'Decisão pendente', 'margin:6px 0;color:#f59e0b'));
            card.appendChild(_misBtn('✅ Aprovar', () => _misAcao(m.id, 'aprovar', { decisao: d.id }), 'var(--adim)'));
            card.appendChild(_misBtn('✋ Negar', () => _misAcao(m.id, 'negar', { decisao: d.id })));
          }
          if (det.missao.relatorio) card.appendChild(_el('div', det.missao.relatorio, 'margin-top:6px;font-size:13px;white-space:pre-wrap'));
        }
        if (!['concluida', 'falhou', 'cancelada'].includes(m.estado)) {
          card.appendChild(_misBtn(m.estado === 'pausada' ? '▶ Retomar' : '⏸ Pausar', () => _misAcao(m.id, m.estado === 'pausada' ? 'retomar' : 'pausar')));
          card.appendChild(_misBtn('⛔ Cancelar', () => _misAcao(m.id, 'cancelar')));
        }
        card.appendChild(_misBtn('↩ Desfazer último', () => _misAcao(m.id, 'desfazer')));
        box.appendChild(card);
      }
    }
    function _missoesAbrir() {
      document.getElementById('mis-painel').style.display = 'block';
      _missoesAtualizar(); clearInterval(_misTimer); _misTimer = setInterval(_missoesAtualizar, 5000);
    }
    function _missoesFechar() { document.getElementById('mis-painel').style.display = 'none'; clearInterval(_misTimer); }

    // Auditoria: linha do tempo do que o NEXUS fez (texto sempre por textContent) e conferência da cadeia de hashes.
    async function _audAtualizar() {
      const box = document.getElementById('aud-lista'); if (!box) return;
      const q = encodeURIComponent(document.getElementById('aud-q').value || '');
      const dias = document.getElementById('aud-dias').value, tipo = encodeURIComponent(document.getElementById('aud-tipo').value);
      let it = [];
      try { it = (await (await _authFetch('/api/auditoria?q=' + q + '&dias=' + dias + '&tipo=' + tipo + '&limite=80')).json()).itens || []; } catch (e) { return; }
      box.textContent = '';
      if (!it.length) { box.appendChild(_el('p', 'Nada encontrado.', 'color:var(--muted)')); return; }
      for (const d of it) {
        const l = _el('div', null, 'border-bottom:1px solid var(--border);padding:8px 0;font-size:14px');
        l.appendChild(_el('div', d.texto));
        l.appendChild(_el('div', d.tipo + (d.missao ? ' · missão ' + d.missao : '') + ' · #' + d.h, 'color:var(--muted);font-size:12px'));
        box.appendChild(l);
      }
    }
    async function _audVerificar() {
      const st = document.getElementById('aud-status');
      try { const d = await (await _authFetch('/api/auditoria/verificar')).json(); st.textContent = (d.integro ? '✅ ' : '⚠️ ') + d.mensagem; }
      catch (e) { st.textContent = 'Sem conexão'; }
    }
    function _audAbrir() { document.getElementById('aud-painel').style.display = 'block'; _audAtualizar(); }
    function _audFechar() { document.getElementById('aud-painel').style.display = 'none'; }
  </script>
<script>
(function () {
  // Atalhos rápidos: preenchem o campo e enviam pelo mesmo caminho do botão ENVIAR.
  var quick = document.getElementById('quick');
  if (quick) quick.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-cmd]'); if (!b) return;
    var inp = document.getElementById('inp'); if (!inp || typeof doSend !== 'function') return;
    inp.value = b.getAttribute('data-cmd'); doSend();
  });
  // Cor de destaque: um toque no 🎨 passa para a próxima; fica guardada neste navegador.
  var TEMAS = [['#6366f1', 'rgba(99,102,241,0.14)'], ['#ff42af', 'rgba(255,66,175,0.14)'], ['#3d9bff', 'rgba(61,155,255,0.14)'],
               ['#2fd9a0', 'rgba(47,217,160,0.14)'], ['#ffb02e', 'rgba(255,176,46,0.14)'], ['#a06bff', 'rgba(160,107,255,0.14)']];
  var idx = 0;
  function aplicar(i) {
    idx = ((i % TEMAS.length) + TEMAS.length) % TEMAS.length;
    document.documentElement.style.setProperty('--accent', TEMAS[idx][0]);
    document.documentElement.style.setProperty('--adim', TEMAS[idx][1]);
  }
  try { var salvo = parseInt(localStorage.getItem('nexus_tema'), 10); if (salvo >= 0) aplicar(salvo); } catch (e) {}
  var btn = document.getElementById('tema-btn');
  if (btn) btn.addEventListener('click', function () {
    aplicar(idx + 1);
    try { localStorage.setItem('nexus_tema', String(idx)); } catch (e) {}
  });
})();
</script>
</body>
